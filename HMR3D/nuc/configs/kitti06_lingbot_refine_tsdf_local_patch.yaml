output:
  output_dir: nuc_output/kitti06_lingbot_refine_tsdf_local_patch
  render_backend: gsplat
  render_save_images: true
  render_compare_stride: 5
  render_max_archived_submaps: 8
  render_min_radius_px: 1.2
  render_max_radius_px: 15.0
  render_background_gray: 0
  render_enable_hole_fill: true
  render_hole_fill_kernel: 7
  render_hole_fill_max_area: 4096
  render_depth_soften: 0.92
  render_internal_scale: 1.0
  render_tile_size: 64
  render_max_active_points: 48000
  render_depth_window_m: 60.0
  render_max_archived_points: 12000
  render_max_warmstart_points: 4096
  render_view_budget_points: 16000
  render_surface_depth_sigma: 0.35
  render_surface_opacity_gain: 1.15
  render_gsplat_tile_size: 16
  render_gsplat_radius_clip: 0.0
  render_gsplat_rasterize_mode: classic

refine:
  refine_steps: 400
  batch_size: 3
  image_scale: 1.0
  lr_xyz: 0.001
  lr_scale: 0.0005
  lr_rotation: 0.0005
  lr_opacity: 0.005
  lr_rgb: 0.01
  lambda_depth: 0.2
  lambda_opacity: 0.0001
  lambda_scale: 0.0001
  lambda_rotation: 0.0001
  lambda_isotropic: 0.0005
  lambda_tangent_max: 0.001
  lambda_normal_max: 0.001
  lambda_anisotropy_ratio: 0.002
  lambda_render_normal: 0.05
  lambda_surface_xyz: 0.2
  lambda_surface_scale: 0.03
  lambda_surface_rotation: 0.03
  lambda_anchor: 0.0001
  lambda_rgb_anchor: 0.0
  lambda_opacity_anchor: 0.0001
  depth_conf_threshold: 1.0
  depth_alpha_threshold: 0.01
  prune_every: 50
  min_opacity: 0.02
  max_points: 4800
  preview_every: 100
  preview_frames: 3
  rgb_ssim_weight: 0.2
  background_gray: 0.0
  near_plane: 0.01
  far_plane: 60.0
  radius_clip: 0.0
  tile_size: 16
  rasterize_mode: classic
  init_max_tangent_scale: 2.0
  init_max_normal_scale: 0.15
  train_max_tangent_scale: 1.5
  train_max_normal_scale: 0.12
  max_anisotropy_ratio: 5.0
  normal_alpha_threshold: 0.05
