  surface_prior_blend: 0.45
  surface_prior_max_points: 1800
  surface_optimize_local_only: true
  surface_unmatched_opacity_scale: 0.35
  surface_unmatched_isotropic_scale: 0.08
  random_seed: 13
  device: cuda
