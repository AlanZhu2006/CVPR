input:
  frame_step: 5
  max_frames: 40

memory:
  enable_v2_write_policy: true
  enable_pose_anchor_gate: true
  enable_shadow_recover: true
  enable_hierarchical_bank: true
  enable_multi_candidate_merge: true
  enable_local_adapt: true
  enable_incremental_gaussian: true
  enable_local_surface_volume: true
  enable_semantic_like_region_filter: true
  enable_lingbot_style_sky_mask: true
  enable_structured_gaussian_init: true
  gaussian_stream_keyframe_interval: 2
  gaussian_stream_optimize_interval: 2
  gaussian_stereo_grid_stride: 8
  gaussian_stereo_num_disparities: 96
  gaussian_stereo_block_size: 5
  gaussian_stereo_min_disparity_px: 1.0
  gaussian_stereo_max_depth_m: 45.0
  gaussian_stereo_max_points_per_frame: 900
  gaussian_stereo_feature_points: 700
  gaussian_stereo_consistency_threshold_px: 1.05
  gaussian_stereo_texture_threshold: 4.5
  gaussian_stereo_fusion_voxel_size: 0.05
  gaussian_local_volume_voxel_size: 0.06
  gaussian_local_volume_extract_points: 1200
  gaussian_local_volume_fuse_stride: 5
  gaussian_local_volume_confidence_threshold: 0.18
  gaussian_local_volume_min_observations: 2
  gaussian_local_volume_visible_depth_margin_m: 0.25
  gaussian_local_volume_visible_max_depth_m: 28.0
  gaussian_local_volume_normal_view_cosine: -0.15
  gaussian_local_volume_block_bad_ratio: 0.45
  gaussian_local_volume_thin_cell_px: 12
  gaussian_local_volume_thin_max_layers: 1
  gaussian_local_volume_thin_depth_gap_m: 0.16
  gaussian_structured_anchor_voxel_size: 0.30
  gaussian_structured_min_points_per_anchor: 5
  gaussian_structured_max_points: 900
  gaussian_structured_anisotropy_gain: 1.85
  gaussian_region_sky_top_ratio: 0.50
  gaussian_region_far_depth_m: 26.0
  gaussian_region_low_confidence_threshold: 0.24
  gaussian_region_vegetation_texture_scale: 2.1
  gaussian_region_dynamic_min_depth_m: 2.0
  gaussian_region_dynamic_max_depth_m: 16.0
  gaussian_sky_brightness_threshold: 92.0
  gaussian_sky_gradient_threshold: 16.0
  gaussian_sky_far_depth_m: 22.0
  gaussian_optimize_steps: 1
  gaussian_optimize_window: 3
  gaussian_optimize_topk: 2400

output:
  output_dir: nuc_output/kitti06_render_benchmark_v10_gsplat_backend
  render_backend: gsplat
  render_save_images: true
  render_compare_stride: 5
  render_internal_scale: 1.0
  render_max_archived_submaps: 6
  render_max_active_points: 8000
  render_max_archived_points: 2000
  render_max_warmstart_points: 800
  render_view_budget_points: 4000
  render_depth_window_m: 35.0
  render_gsplat_tile_size: 16
  render_gsplat_radius_clip: 0.0
  render_gsplat_rasterize_mode: classic
