input:
  frame_step: 5
  max_frames: 200

memory:
  enable_v2_write_policy: true
  enable_pose_anchor_gate: true
  enable_shadow_recover: true
  enable_hierarchical_bank: true
  enable_multi_candidate_merge: true
  enable_local_adapt: true
  enable_incremental_gaussian: true
  enable_local_surface_volume: true
  enable_semantic_like_region_filter: true
  enable_lingbot_style_sky_mask: true
  enable_structured_gaussian_init: true
  gaussian_stream_keyframe_interval: 2
  gaussian_stream_optimize_interval: 1
  gaussian_warmstart_max_points: 192
  gaussian_stereo_grid_stride: 7
  gaussian_stereo_num_disparities: 96
  gaussian_stereo_block_size: 5
  gaussian_stereo_min_disparity_px: 1.0
  gaussian_stereo_max_depth_m: 42.0
  gaussian_stereo_max_points_per_frame: 1500
  gaussian_stereo_stride_scale: 0.78
  gaussian_pair_stride_scale: 0.58
  gaussian_stereo_feature_points: 1200
  gaussian_stereo_consistency_threshold_px: 1.15
  gaussian_stereo_texture_threshold: 4.0
  gaussian_stereo_fusion_voxel_size: 0.045
  gaussian_stereo_quadtree_min_block: 14
  gaussian_stereo_quadtree_var_threshold: 0.20
  gaussian_stereo_depth_edge_threshold: 1.15
  gaussian_local_volume_voxel_size: 0.055
  gaussian_local_volume_extract_points: 2200
  gaussian_local_volume_fuse_stride: 5
  gaussian_local_volume_confidence_threshold: 0.18
  gaussian_local_volume_min_observations: 2
  gaussian_local_volume_visible_depth_margin_m: 0.25
  gaussian_local_volume_visible_max_depth_m: 28.0
  gaussian_local_volume_normal_view_cosine: -0.15
  gaussian_local_volume_block_bad_ratio: 0.46
  gaussian_local_volume_thin_cell_px: 11
  gaussian_local_volume_thin_max_layers: 1
  gaussian_local_volume_thin_depth_gap_m: 0.15
  gaussian_structured_anchor_voxel_size: 0.24
  gaussian_structured_min_points_per_anchor: 4
  gaussian_structured_max_points: 1400
  gaussian_structured_anisotropy_gain: 1.85
  gaussian_region_sky_top_ratio: 0.50
  gaussian_region_far_depth_m: 25.0
  gaussian_region_low_confidence_threshold: 0.22
  gaussian_region_vegetation_texture_scale: 2.2
  gaussian_region_dynamic_min_depth_m: 2.0
  gaussian_region_dynamic_max_depth_m: 16.0
  gaussian_sky_brightness_threshold: 92.0
  gaussian_sky_gradient_threshold: 16.0
  gaussian_sky_far_depth_m: 22.0
  gaussian_optimize_steps: 1
  gaussian_optimize_window: 3
  gaussian_optimize_lr_position: 0.05
  gaussian_optimize_lr_scale: 0.045
  gaussian_optimize_lr_opacity: 0.06
  gaussian_optimize_lr_color: 0.16
  gaussian_optimize_topk: 900
  gaussian_optimize_error_threshold: 14.0
  gaussian_optimize_unstable_decay: 0.86
  gaussian_optimize_new_point_boost: 0.25
  gaussian_optimize_recover_boost: 0.82
  gaussian_optimize_depth_weight: 0.42
  gaussian_optimize_depth_score_weight: 0.68
  gaussian_optimize_depth_gate_m: 1.0
  gaussian_optimize_fast_refine_mode: true
  gaussian_optimize_candidate_error_ratio: 0.55
  gaussian_optimize_candidate_recentness_floor: 0.10
  gaussian_optimize_candidate_unstable_floor: 0.30
  gaussian_optimize_recovered_source_boost: 1.0
  gaussian_optimize_structured_source_boost: 0.72
  gaussian_optimize_pair_source_boost: 0.24
  gaussian_optimize_depth_candidate_boost: 0.50
  gaussian_optimize_recover_refine_frames: 5
  gaussian_optimize_recover_extra_topk: 300
  gaussian_optimize_recover_structured_bonus: 0.60
  gaussian_optimize_recover_recentness_bonus: 0.30
  gaussian_coarse_voxel_size: 0.38
  gaussian_coarse_max_points: 1600
  gaussian_full_recent_archives: 2

output:
  output_dir: nuc_output/kitti06_render_benchmark_v14_stable_budget
  render_backend: cpu
  render_save_images: true
  render_compare_stride: 5
  render_max_archived_submaps: 8
  render_min_radius_px: 1.15
  render_max_radius_px: 14.0
  render_enable_hole_fill: true
  render_hole_fill_kernel: 5
  render_hole_fill_max_area: 1600
  render_depth_soften: 0.98
  render_internal_scale: 0.54
  render_tile_size: 48
  render_max_active_points: 14000
  render_depth_window_m: 36.0
  render_max_archived_points: 4200
  render_max_warmstart_points: 1000
  render_view_budget_points: 7200
  render_surface_depth_sigma: 0.11
  render_surface_opacity_gain: 1.36
