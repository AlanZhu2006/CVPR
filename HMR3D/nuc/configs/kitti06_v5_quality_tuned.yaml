input:
  frame_step: 5
  max_frames: 200

memory:
  enable_v2_write_policy: true
  enable_pose_anchor_gate: true
  enable_shadow_recover: true
  enable_hierarchical_bank: true
  enable_multi_candidate_merge: true
  enable_local_adapt: true
  enable_incremental_gaussian: true
  gaussian_warmstart_max_points: 192
  gaussian_stereo_grid_stride: 8
  gaussian_stereo_num_disparities: 96
  gaussian_stereo_block_size: 5
  gaussian_stereo_min_disparity_px: 1.0
  gaussian_stereo_max_depth_m: 50.0
  gaussian_stereo_max_points_per_frame: 2200
  gaussian_stereo_stride_scale: 0.78
  gaussian_pair_stride_scale: 0.60
  gaussian_stereo_feature_points: 1200
  gaussian_stereo_consistency_threshold_px: 1.15
  gaussian_stereo_texture_threshold: 4.0
  gaussian_stereo_fusion_voxel_size: 0.045
  gaussian_stereo_quadtree_min_block: 18
  gaussian_stereo_quadtree_var_threshold: 0.22
  gaussian_stereo_depth_edge_threshold: 1.0
  gaussian_optimize_steps: 4
  gaussian_optimize_window: 4
  gaussian_optimize_lr_position: 0.08
  gaussian_optimize_lr_scale: 0.06
  gaussian_optimize_lr_opacity: 0.09
  gaussian_optimize_lr_color: 0.20
  gaussian_optimize_topk: 7000
  gaussian_optimize_error_threshold: 18.0
  gaussian_optimize_unstable_decay: 0.90
  gaussian_optimize_new_point_boost: 0.42
  gaussian_optimize_recover_boost: 0.62
  gaussian_optimize_depth_weight: 0.42
  gaussian_optimize_depth_score_weight: 0.72
  gaussian_optimize_depth_gate_m: 1.2
  gaussian_coarse_voxel_size: 0.42
  gaussian_coarse_max_points: 1500
  gaussian_full_recent_archives: 2

output:
  output_dir: nuc_output/kitti06_render_benchmark_v5_quality_tuned
  render_save_images: true
  render_compare_stride: 5
  render_max_archived_submaps: 8
  render_min_radius_px: 1.2
  render_max_radius_px: 14.0
  render_enable_hole_fill: true
  render_hole_fill_kernel: 5
  render_hole_fill_max_area: 1600
  render_depth_soften: 0.98
  render_internal_scale: 0.55
  render_tile_size: 48
  render_max_active_points: 26000
  render_depth_window_m: 45.0
  render_max_archived_points: 6500
  render_max_warmstart_points: 1500
  render_view_budget_points: 12000
  render_surface_depth_sigma: 0.12
  render_surface_opacity_gain: 1.35
